<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RapScore MX — Rankings de Rap Mexicano</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --surface2: #1a1a1a;
  --border: #2a2a2a;
  --accent: #ff3c00;
  --accent2: #ffcc00;
  --text: #f0ede6;
  --muted: #666;
  --green: #00e676;
  --purple: #b388ff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}

/* NOISE TEXTURE */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}
.hamburger { display: none; }

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 3px;
  color: var(--text);
}
.logo span { color: var(--accent); }

nav { display: flex; gap: 0; }
nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 8px 14px;
  transition: color .2s;
  text-transform: uppercase;
}
nav a:hover, nav a.active { color: var(--text); }
nav a.active { border-bottom: 2px solid var(--accent); }

.header-actions { display: flex; gap: 10px; align-items: center; }
.btn-sm {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  padding: 7px 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all .2s;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: #ff5a2a; color: #fff; }

/* HERO */
.hero {
  position: relative;
  padding: 80px 24px 60px;
  max-width: 1400px;
  margin: 0 auto;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
}

.hero-label {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.hero-label::before {
  content: '';
  width: 24px;
  height: 1px;
  background: var(--accent);
}

h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(52px, 7vw, 96px);
  line-height: 0.92;
  letter-spacing: 2px;
  margin-bottom: 24px;
}
h1 em { color: var(--accent); font-style: normal; }

.hero-sub {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
  max-width: 400px;
  margin-bottom: 32px;
}

.hero-stats {
  display: flex;
  gap: 32px;
}
.stat { }
.stat-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  color: var(--accent2);
  display: block;
  line-height: 1;
}
.stat-label {
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--muted);
  text-transform: uppercase;
}

/* RADAR PREVIEW */
.radar-preview {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* FILTERS / CONTROLS */
.controls {
  position: sticky;
  top: 60px;
  z-index: 90;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}
.controls-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  gap: 0;
  align-items: center;
  overflow-x: auto;
  scrollbar-width: none;
}
.controls-inner::-webkit-scrollbar { display: none; }

.filter-btn {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 16px 16px;
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: all .2s;
}
.filter-btn:hover { color: var(--text); }
.filter-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

.search-wrap {
  margin-left: auto;
  position: relative;
}
.search-input {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  padding: 6px 12px 6px 30px;
  outline: none;
  width: 200px;
  letter-spacing: 1px;
}
.search-input::placeholder { color: var(--muted); }
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 12px;
  pointer-events: none;
}

/* MAIN LAYOUT */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* SECTION HEADER */
.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 40px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
}
.section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  letter-spacing: 2px;
}
.section-count {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
}

/* SORT CONTROLS */
.sort-row {
  display: flex;
  gap: 0;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.sort-row::-webkit-scrollbar { display: none; }
.sort-btn {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 6px 14px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all .2s;
}
.sort-btn:hover { color: var(--text); }
.sort-btn.active {
  color: var(--accent2);
  border-color: var(--accent2);
}

/* ARTIST TABLE */
.artist-table { width: 100%; }

.artist-row {
  display: grid;
  grid-template-columns: 48px 1fr 90px 90px 90px 90px 90px 90px 36px;
  align-items: center;
  padding: 0 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
  position: relative;
}
.artist-row:hover { background: var(--surface); }
.artist-row.selected { background: var(--surface2); }

/* column headers */
.table-header {
  display: grid;
  grid-template-columns: 48px 1fr 90px 90px 90px 90px 90px 90px 36px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 2px solid var(--border);
}
.th-cell {
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
}
.th-cell:nth-child(2) { text-align: left; padding-left: 12px; }

/* cells */
.rank-cell {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  color: var(--muted);
  text-align: center;
  padding: 14px 0;
}
.artist-row:nth-child(-n+3) .rank-cell { color: var(--accent); }

.info-cell {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  min-width: 0;
}

.avatar {
  width: 38px;
  height: 38px;
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  color: var(--muted);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.artist-row:nth-child(-n+3) .avatar {
  border-color: var(--accent);
  color: var(--accent);
}

.artist-name {
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.artist-tag {
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 2px;
}

.score-cell {
  text-align: center;
  padding: 10px 4px;
}
.score-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  line-height: 1;
  display: block;
}
.score-bar {
  height: 2px;
  background: var(--border);
  margin: 4px 8px 0;
  position: relative;
  overflow: hidden;
}
.score-fill {
  height: 100%;
  background: var(--accent);
  position: absolute;
  left: 0;
  top: 0;
  transition: width .6s ease;
}

.total-cell {
  text-align: center;
}
.total-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  color: var(--accent2);
}

.action-cell {
  text-align: center;
}
.expand-btn {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  padding: 10px;
  transition: color .2s, transform .2s;
  line-height: 1;
}
.expand-btn:hover { color: var(--accent); }
.expand-btn.open { transform: rotate(180deg); color: var(--accent); }

/* EXPANDED PANEL */
.expanded-panel {
  display: none;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 24px;
  grid-column: 1 / -1;
  animation: slideDown .2s ease;
}
.expanded-panel.open { display: grid; grid-template-columns: 1fr 280px; gap: 32px; }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.expanded-left h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 2px;
  margin-bottom: 4px;
}
.expanded-bio {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.8;
  margin-bottom: 20px;
  max-width: 500px;
}

.cats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.cat-item { }
.cat-name {
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
.cat-bar-wrap {
  height: 3px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}
.cat-bar-fill {
  height: 100%;
  position: absolute;
  left: 0; top: 0;
  background: var(--accent);
}
.cat-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  margin-top: 2px;
}

/* RADAR */
.radar-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.radar-title {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}

/* VOTE SECTION */
.vote-section {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: center;
}
.vote-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.vote-btn {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  letter-spacing: 1px;
  transition: all .15s;
}
.vote-btn:hover { border-color: var(--accent); color: var(--accent); }
.vote-btn.voted { background: var(--accent); border-color: var(--accent); color: #fff; }

/* COMPARE BAR */
.compare-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--accent);
  padding: 12px 24px;
  display: none;
  align-items: center;
  gap: 16px;
  z-index: 200;
  animation: slideUp .2s ease;
}
.compare-bar.show { display: flex; }
@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.compare-names {
  flex: 1;
  display: flex;
  gap: 12px;
  align-items: center;
}
.compare-chip {
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 4px 10px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.compare-chip-x {
  color: var(--muted);
  cursor: pointer;
  background: none;
  border: none;
  font-size: 12px;
  padding: 0;
  line-height: 1;
}
.compare-chip-x:hover { color: var(--accent); }
.compare-label {
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
}
.btn-compare {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  padding: 9px 20px;
  background: var(--accent);
  border: none;
  color: #fff;
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: background .2s;
}
.btn-compare:hover { background: #ff5a2a; }

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  width: 100%;
  max-width: 820px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 32px;
  position: relative;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.97); }
  to   { opacity: 1; transform: scale(1); }
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
  transition: color .2s;
}
.modal-close:hover { color: var(--accent); }
.modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 48px;
  letter-spacing: 2px;
  margin-bottom: 4px;
}
.modal-sub { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 28px; }

.compare-grid { display: grid; grid-template-columns: 1fr 40px 1fr; gap: 16px; align-items: start; margin-bottom: 28px; }
.compare-col { }
.compare-artist-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  margin-bottom: 16px;
}
.vs-col {
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 6px;
}
.vs-badge {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  color: var(--accent);
  border: 1px solid var(--accent);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.compare-cat-row {
  display: grid;
  grid-template-columns: 1fr 40px 1fr;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}
.compare-cat-name {
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  grid-column: 1 / -1;
  margin-bottom: 2px;
}
.cc-bar {
  height: 4px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}
.cc-fill-l {
  height: 100%;
  position: absolute;
  right: 0;
  background: var(--accent);
}
.cc-fill-r {
  height: 100%;
  position: absolute;
  left: 0;
  background: var(--purple);
}
.cc-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  text-align: center;
}

/* EMERGENTES badge */
.badge-emer {
  font-size: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 2px 6px;
  background: rgba(0,230,118,0.1);
  color: var(--green);
  border: 1px solid rgba(0,230,118,0.3);
  margin-left: 6px;
  vertical-align: middle;
}
.badge-legend {
  font-size: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 2px 6px;
  background: rgba(255,204,0,0.1);
  color: var(--accent2);
  border: 1px solid rgba(255,204,0,0.3);
  margin-left: 6px;
  vertical-align: middle;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--accent);
  color: #fff;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 10px 20px;
  z-index: 400;
  opacity: 0;
  transition: all .3s;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* TICKER */
.ticker {
  background: var(--accent);
  overflow: hidden;
  height: 30px;
  display: flex;
  align-items: center;
}
.ticker-inner {
  display: flex;
  gap: 48px;
  animation: ticker 30s linear infinite;
  white-space: nowrap;
  padding-right: 48px;
}
@keyframes ticker {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.ticker-item {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #fff;
  font-weight: 700;
}
.ticker-sep { color: rgba(255,255,255,0.4); }

/* VOTACIÓN */
.total-votes { display:block; font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-top:2px; }
.score-split { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border:1px solid var(--border); margin:4px 0 20px; }
.ss-item { background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
.ss-label { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
.ss-val { font-family:'Bebas Neue',sans-serif; font-size:30px; line-height:1; color:var(--text); }
.ss-final { color:var(--accent2); }
.ss-sub { font-size:9px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }
.rate-box { margin-top:18px; padding:16px; border:1px solid var(--border); background:var(--bg); }
.rate-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.rate-title { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text); }
.rate-badge { font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--accent2); border:1px solid rgba(255,204,0,.35); padding:2px 8px; }
.rate-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 24px; }
.rate-row { display:grid; grid-template-columns:88px 1fr 34px; align-items:center; gap:10px; cursor:pointer; }
.rate-cat { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
.rate-val { font-family:'Bebas Neue',sans-serif; font-size:20px; text-align:right; color:var(--text); }
.rate-row input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:4px; background:var(--border); outline:none; margin:0; }
.rate-row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; background:var(--accent); border:none; cursor:pointer; }
.rate-row input[type=range]::-moz-range-thumb { width:16px; height:16px; background:var(--accent); border:none; border-radius:0; cursor:pointer; }
.rate-row input[type=range]:focus-visible { outline:1px solid var(--accent2); outline-offset:4px; }
.rate-actions { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px; }
.rate-submit { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:10px 18px; background:var(--accent); color:#fff; border:none; cursor:pointer; }
.rate-submit:hover { filter:brightness(1.1); }
.rate-submit:disabled { opacity:.5; cursor:wait; }
.rate-note { font-size:10px; color:var(--muted); line-height:1.6; }
@media (max-width: 768px) {
  .rate-grid { grid-template-columns:1fr; }
  .score-split .ss-val { font-size:24px; }
}

/* SCROLLBAR */

// compute total
const ARTISTS = RAW_ARTISTS.map(a => ({
  ...a,
  slug: slugify(a.name),
  editorial: { ...a.scores },
  editorialTotal: avgScores(a.scores),
  community: null,
  total: avgScores(a.scores)
}));

// Mezcla puntuación editorial + calificaciones de la comunidad
function blendArtist(a, stat) {
  if (!a.editorial) { a.editorial = { ...a.scores }; a.editorialTotal = avgScores(a.scores); }
  if (!a.slug) a.slug = slugify(a.name);
  const n = stat && stat.count > 0 ? stat.count : 0;
  if (n > 0) {
    const comm = {};
    CATEGORIES.forEach(c => { comm[c] = (stat.sum?.[c] || 0) / n; });
    a.community = { scores: comm, count: n, total: avgScores(comm) };
    CATEGORIES.forEach(c => {
      a.scores[c] = Math.round((COMMUNITY_WEIGHT_K * a.editorial[c] + n * comm[c]) / (COMMUNITY_WEIGHT_K + n));
    });
  } else {
    a.community = null;
    CATEGORIES.forEach(c => { a.scores[c] = a.editorial[c]; });
  }
  a.total = avgScores(a.scores);
}

window.applyCommunityStats = function(stats) {
  if (stats) window._communityStats = stats;
  ARTISTS.forEach(a => blendArtist(a, window._communityStats[a.slug]));
  refreshTable();
  if (typeof buildTicker === 'function') buildTicker();
  if (typeof refreshEstados === 'function') refreshEstados();
  if (expandedRow) {
    const a = ARTISTS.find(x => x.name === expandedRow);
    const panel = a && document.getElementById('panel-' + safeName(a.name));
    if (panel && panel.classList.contains('open')) {
      panel.innerHTML = buildPanel(a);
      drawRadar('radar-' + safeName(a.name), a.scores, '#ff3c00');
    }
  }
};

// estado de la tabla
let currentSort = 'total', currentTier = 'all', currentSearch = '';
let currentData = [...ARTISTS].sort((a,b) => b.total - a.total);

function refreshTable() {
  let list = ARTISTS.filter(a => currentTier === 'all' ? true
    : currentTier === 'female' ? a.female === true : a.tier === currentTier);
  if (currentSearch) {
    const t = currentSearch.toLowerCase();
    list = list.filter(a => a.name.toLowerCase().includes(t) || (a.tags||[]).some(x => x.toLowerCase().includes(t)));
  }
  list.sort((a,b) => currentSort === 'total' ? b.total - a.total
    : (b.scores[currentSort] - a.scores[currentSort]) || (b.total - a.total));
  currentData = list;
  renderTable(currentData);
}

function getInitials(name) {
  return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function getTierBadge(tier) {
  if (tier === 'legend') return '<span class="badge-legend">Leyenda</span>';
  if (tier === 'emerging') return '<span class="badge-emer">Emergente</span>';
  return '';
}

function renderTable(data) {
  const tbody = document.getElementById('artistTable');
  document.getElementById('countLabel').textContent = data.length + ' artistas';
  tbody.innerHTML = '';

  data.forEach((artist, i) => {
    const isCompared = compareList.includes(artist.name);
    const row = document.createElement('div');
    row.innerHTML = `
      <div class="artist-row ${isCompared?'selected':''}" data-name="${artist.name}" onclick="handleRowClick(event,'${artist.name}')">
        <div class="rank-cell">${i+1}</div>
        <div class="info-cell">
          <div class="avatar">${getInitials(artist.name)}</div>

        <div class="action-cell">

    `;

}

function safeName(n) { return n.replace(/[^a-zA-Z0-9]/g,'_'); }

function toggleExpand(e, name) {
  e.stopPropagation();
  const panel = document.getElementById('panel-' + safeName(name));
  const btn = e.currentTarget;
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
    btn.classList.remove('open');
    expandedRow = null;
    return;
  }
  // close others
  document.querySelectorAll('.expanded-panel.open').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.expand-btn.open').forEach(b => b.classList.remove('open'));

  const artist = ARTISTS.find(a => a.name === name);
  panel.innerHTML = buildPanel(artist);
  panel.classList.add('open');
  btn.classList.add('open');
  expandedRow = name;
  drawRadar('radar-' + safeName(name), artist.scores, '#ff3c00');
}

function buildRateBox(slug, name, baseScores) {
  const mine = typeof window.getMyRating === 'function' ? window.getMyRating(slug) : null;
  const start = mine || baseScores;
  const sliders = CATEGORIES.map(c => `
    <label class="rate-row">
      <span class="rate-cat">${CAT_LABELS[c]}</span>
      <input type="range" min="1" max="100" step="1" value="${start[c]}" data-cat="${c}"
        oninput="this.nextElementSibling.textContent=this.value">
      <output class="rate-val">${start[c]}</output>
    </label>`).join('');
  return `
    <div class="rate-box" data-slug="${esc(slug)}" data-name="${esc(name)}">
      <div class="rate-head">
        <span class="rate-title">${mine ? 'Tu calificación' : 'Califica a ' + esc(name)}</span>
        ${mine ? '<span class="rate-badge">Ya votaste · puedes cambiarla</span>' : ''}
      </div>
      <div class="rate-grid">${sliders}</div>
      <div class="rate-actions">
        <button class="rate-submit" onclick="window.submitRating ? submitRating(this) : showToast('La votación no está disponible en este momento')">${mine ? 'Actualizar calificación' : 'Guardar calificación'}</button>
        <span class="rate-note">1 = flojo · 100 = élite. Un voto por cuenta; puedes cambiarlo cuando quieras.</span>
      </div>
    </div>`;
}

function buildPanel(artist) {
  const cats = CATEGORIES.map(c => `
    <div class="cat-item">
      <div class="cat-name">${CAT_LABELS[c]}</div>
      <div class="cat-bar-wrap"><div class="cat-bar-fill" style="width:${artist.scores[c]}%"></div></div>
      <div class="cat-val">${artist.scores[c]}</div>
    </div>
  `).join('');
  const comm = artist.community;
  return `
    <div class="expanded-left">
      <h3>${esc(artist.name)}</h3>
      <p class="expanded-bio">${esc(artist.bio)}</p>
      <div class="score-split">
        <div class="ss-item"><span class="ss-label">Crítica</span><span class="ss-val">${artist.editorialTotal}</span></div>
        <div class="ss-item"><span class="ss-label">Comunidad</span><span class="ss-val">${comm ? comm.total : '—'}</span><span class="ss-sub">${comm ? comm.count + ' voto' + (comm.count===1?'':'s') : 'Sin votos aún'}</span></div>
        <div class="ss-item"><span class="ss-label">Score final</span><span class="ss-val ss-final">${artist.total}</span></div>
      </div>
      <div class="cats-grid">${cats}</div>
      ${buildRateBox(artist.slug, artist.name, artist.editorial)}
      <div class="vote-section">
        <button class="vote-btn" style="margin-left:auto" onclick="addToCompare('${artist.name.replace(/'/g, "\\'")}')">+ Comparar</button>
      </div>
    </div>
    <div class="radar-wrap">
      <div class="radar-title">Gráfica radar</div>
      <canvas id="radar-${safeName(artist.name)}" width="240" height="240"></canvas>
    </div>
  `;
}

function drawRadar(canvasId, scores, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = 240, H = 240;
  const cx = W/2, cy = H/2, R = 90;
  const cats = CATEGORIES;
  const n = cats.length;
  const angle0 = -Math.PI/2;

  ctx.clearRect(0,0,W,H);

  // grid
  [0.2,0.4,0.6,0.8,1].forEach(f => {
    ctx.beginPath();
    for (let i=0;i<n;i++) {
      const a = angle0 + (2*Math.PI*i/n);
      const x = cx + R*f*Math.cos(a), y = cy + R*f*Math.sin(a);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  });

  // spokes + labels
  cats.forEach((c,i) => {
    const a = angle0 + (2*Math.PI*i/n);
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+R*Math.cos(a), cy+R*Math.sin(a));
    ctx.strokeStyle='rgba(255,255,255,0.12)';
    ctx.lineWidth=0.5;
    ctx.stroke();
    const lx = cx+(R+18)*Math.cos(a), ly = cy+(R+18)*Math.sin(a);
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.font='9px Space Mono, monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(CAT_LABELS[c].slice(0,6).toUpperCase(), lx, ly);
  });

  // data
  ctx.beginPath();
  cats.forEach((c,i) => {
    const a = angle0 + (2*Math.PI*i/n);
    const v = scores[c]/100;
    const x = cx+R*v*Math.cos(a), y = cy+R*v*Math.sin(a);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle = color+'33';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // dots
  cats.forEach((c,i) => {
    const a = angle0 + (2*Math.PI*i/n);
    const v = scores[c]/100;
    ctx.beginPath();
    ctx.arc(cx+R*v*Math.cos(a), cy+R*v*Math.sin(a), 3, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
  });
}

function drawRadarSmall(id, scores, color) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W=160,H=160,cx=W/2,cy=H/2,R=58;
  const n=CATEGORIES.length, a0=-Math.PI/2;
  ctx.clearRect(0,0,W,H);
  [0.25,0.5,0.75,1].forEach(f=>{
    ctx.beginPath();
    for(let i=0;i<n;i++){const a=a0+2*Math.PI*i/n;i===0?ctx.moveTo(cx+R*f*Math.cos(a),cy+R*f*Math.sin(a)):ctx.lineTo(cx+R*f*Math.cos(a),cy+R*f*Math.sin(a));}
    ctx.closePath();ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=0.5;ctx.stroke();
  });
  ctx.beginPath();
  CATEGORIES.forEach((c,i)=>{const a=a0+2*Math.PI*i/n,v=scores[c]/100;i===0?ctx.moveTo(cx+R*v*Math.cos(a),cy+R*v*Math.sin(a)):ctx.lineTo(cx+R*v*Math.cos(a),cy+R*v*Math.sin(a));});
  ctx.closePath();ctx.fillStyle=color+'33';ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();
}

// ════════════════════════════════════════════════════════════
// GOOGLE SHEETS CSV LOADER
// ════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════
// CONFIGURACIÓN — pega tu URL de Google Sheets aquí
// Pasos: Google Sheets → Archivo → Publicar en la web
//        → Hoja "ARTISTAS" → CSV → Publicar → copiar URL
// ══════════════════════════════════════════════════════════
const GOOGLE_SHEETS_CSV_URL = 'TU_URL_AQUI';
// Ejemplo:
// const GOOGLE_SHEETS_CSV_URL =
//   'https://docs.google.com/spreadsheets/d/XXXX/pub?gid=0&single=true&output=csv';

// Column indices (0-based) — must match Excel column order
// A=0  B=1  C=2  D=3  E=4  F=5
// G=6  H=7  I=8  J=9  K=10 L=11
// M=12 N=13 O=14 P=15 Q=16
// R=17(promedio, skip) S=18(bio) T=19(tags) U=20(link) V=21(votos)
const COL = {
  num:0, name:1, estado:2, tipo:3, tier:4, genero:5,
  flow:6, lirica:7, contenido:8, versatilidad:9, hooks:10, impacto:11,
  delivery:12, originalidad:13, freestyle:14, proyectos:15, identidad:16,
  promedio:17, bio:18, tags:19, link:20, votos:21
};

const SCORE_KEYS = ['flow','lirica','contenido','versatilidad','hooks',
                    'impacto','delivery','originalidad','freestyle',
                    'proyectos','identidad'];

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQ = !inQ; }
    else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  result.push(cur.trim());
  return result;
}

function rowToArtist(cols) {
  if (cols.length < 17) return null;
  const name = cols[COL.name];
  if (!name || name === 'NOMBRE') return null; // skip header rows

  const scores = {};
  let total = 0, count = 0;
  SCORE_KEYS.forEach((k, i) => {
    const v = parseInt(cols[COL.flow + i]) || 0;
    scores[k] = v;
    if (v > 0) { total += v; count++; }
  });

  const tipo  = (cols[COL.tipo]  || 'nacional').toLowerCase().trim();
  const tier  = (cols[COL.tier]  || 'Activo').trim();
  const tags  = (cols[COL.tags]  || '').split('|').map(t => t.trim()).filter(Boolean);
  const avg   = count > 0 ? Math.round(total / count) : 0;

  return {
    name,
    estado: cols[COL.estado] || '',
    tipo,                          // 'nacional' | 'propuesto'
    tier,
    genero: cols[COL.genero] || '',
    scores,
    total: avg,
    bio:   cols[COL.bio]  || '',
    tags:  tags.length ? tags : [cols[COL.genero] || 'Rap'],
    link:  cols[COL.link] || '',
    votes: parseInt(cols[COL.votos]) || 0,
    // for backward compat with existing ESTADOS proposed structure
    genre: cols[COL.genero] || '',
  };
}

function applyGoogleSheetsData(artists) {
  // Split into nacionales and propuestos
  const nacionales  = artists.filter(a => a.tipo === 'nacional');
  const propuestos  = artists.filter(a => a.tipo === 'propuesto');

  // Replace global ARTISTS array (used by ranking table)
  ARTISTS.length = 0;
  nacionales.forEach(a => ARTISTS.push(a));

  // Rebuild ESTADOS proposed arrays
  ESTADOS.forEach(e => { e.proposed = []; e.artists = []; });

  nacionales.forEach(a => {
    const e = ESTADOS.find(e => e.name === a.estado ||
                                e.id   === a.estado);
    if (e) e.artists.push({ name: a.name, genre: a.genero,
                             score: a.total, national: true });
  });

  propuestos.forEach(a => {
    const e = ESTADOS.find(e => e.name === a.estado ||
                                e.id   === a.estado);
    if (e) e.proposed.push({
      name:   a.name,
      genre:  a.genero,
      link:   a.link,
      votes:  a.votes,
      bio:    a.bio,
      scores: a.scores,
      total:  a.total,
    });
  });

  // Re-render everything
  ARTISTS.forEach(a => { a.slug = slugify(a.name); a.editorial = { ...a.scores }; a.editorialTotal = avgScores(a.scores); });
  window.applyCommunityStats();
  if (_estadosRendered) {
    _estadosRendered = false;
    renderEstados();
  }
}

async function loadFromGoogleSheets(url) {
  // url puede ser pasada directamente o leída de la constante
  if (!url) url = GOOGLE_SHEETS_CSV_URL;
  if (!url || url === 'TU_URL_AQUI') return; // no configurado aún

  // Auto-convertir URL de edición a URL de CSV si es necesario
  if (url.includes('/edit') || !url.includes('/pub?')) {
    const match = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
    if (match) {
      url = `https://docs.google.com/spreadsheets/d/${match[1]}/pub?gid=0&single=true&output=csv`;
    }
  }

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const csv = await res.text();
    const lines = csv.split('\n').filter(l => l.trim());
    if (lines.length < 2) return;

    const artists = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = parseCSVLine(lines[i]);
      const a = rowToArtist(cols);
      if (a) artists.push(a);
    }

    if (artists.length > 0) {
      applyGoogleSheetsData(artists);
      console.log(`RapScore: ${artists.length} artistas cargados desde Google Sheets`);
    }
  } catch(err) {
    console.warn('RapScore Google Sheets:', err.message);
    // Falla silenciosamente — la página usa datos locales como fallback
  }
}

// Carga silenciosa al iniciar la página
(function autoLoad() {
  if (GOOGLE_SHEETS_CSV_URL && GOOGLE_SHEETS_CSV_URL !== 'TU_URL_AQUI') {
    setTimeout(() => loadFromGoogleSheets(GOOGLE_SHEETS_CSV_URL), 600);
  }
})();

// ─── TICKER (generado desde los datos) ─────────────────────
function buildTicker() {
  const el = document.getElementById('ticker');
  if (!el || !ARTISTS.length) return;
  const top = (fn) => [...ARTISTS].sort((a,b)=>fn(b)-fn(a))[0];
  const items = [];
  items.push([top(a=>a.total).name, '#1 OVERALL']);
  [['flow','#1 FLOW'],['lirica','#1 LÍRICA'],['contenido','#1 CONTENIDO'],
   ['versatilidad','#1 VERSATILIDAD'],['hooks','#1 HOOKS'],['impacto','#1 IMPACTO CULTURAL']]
    .forEach(([k,label]) => items.push([top(a=>a.scores[k]||0).name, label]));
  const fem = ARTISTS.filter(a=>a.female);
  if (fem.length) items.push([[...fem].sort((a,b)=>b.total-a.total)[0].name, '#1 ARTISTAS FEMENINAS']);
  const emer = ARTISTS.filter(a=>a.tier==='emerging');
  if (emer.length) items.push([[...emer].sort((a,b)=>b.total-a.total)[0].name, '#1 EMERGENTES']);
  const html = items.map(([n,l]) => `<span class="ticker-item">${n} <span class="ticker-sep">—</span> ${l}</span>`).join('');
  el.innerHTML = html + html; // duplicado para el loop continuo
}

// ─── INIT ───────────────────────────────────────────────────
renderTable(currentData);
buildTicker();
</script>

<script>
// ── ESTADOS DATA ─────────────────────────────────────────────
const ESTADOS = [
  { id:'AGU', name:'Aguascalientes', artists:[], proposed:[] },
  { id:'BCN', name:'Baja California', artists:[], proposed:[] },
  { id:'BCS', name:'Baja California Sur', artists:[], proposed:[]},
  { id:'CAM', name:'Campeche', artists:[], proposed:[] },
  { id:'CHP', name:'Chiapas', artists:[], proposed:[]},
  { id:'CHH', name:'Chihuahua', artists:[], proposed:[]},
  { id:'CMX', name:'Ciudad de México', artists:[], proposed:[]},
  { id:'COA', name:'Coahuila', artists:[], proposed:[] },
  { id:'COL', name:'Colima', artists:[], proposed:[] },
  { id:'DUR', name:'Durango', artists:[], proposed:[]},
  { id:'GUA', name:'Guanajuato', artists:[], proposed:[] },
  { id:'GRO', name:'Guerrero', artists:[], proposed:[]},
  { id:'HID', name:'Hidalgo', artists:[], proposed:[] },
  { id:'JAL', name:'Jalisco', artists:[], proposed:[]},
  { id:'MEX', name:'Estado de México', artists:[], proposed:[]},
  { id:'MIC', name:'Michoacán', artists:[], proposed:[]},
  { id:'MOR', name:'Morelos', artists:[], proposed:[] },
  { id:'NAY', name:'Nayarit', artists:[], proposed:[] },
  { id:'NLE', name:'Nuevo León', artists:[], proposed:[]},
  { id:'OAX', name:'Oaxaca', artists:[], proposed:[]},
  { id:'PUE', name:'Puebla', artists:[], proposed:[]},
  { id:'QUE', name:'Querétaro', artists:[], proposed:[] },
  { id:'ROO', name:'Quintana Roo', artists:[], proposed:[] },
  { id:'SLP', name:'San Luis Potosí', artists:[], proposed:[] },
  { id:'SIN', name:'Sinaloa', artists:[], proposed:[]},
  { id:'SON', name:'Sonora', artists:[], proposed:[]},
  { id:'TAB', name:'Tabasco', artists:[], proposed:[] },
  { id:'TAM', name:'Tamaulipas', artists:[], proposed:[]},
  { id:'TLA', name:'Tlaxcala', artists:[], proposed:[] },
  { id:'VER', name:'Veracruz', artists:[], proposed:[]},
  { id:'YUC', name:'Yucatán', artists:[], proposed:[]},
  { id:'ZAC', name:'Zacatecas', artists:[], proposed:[] }
];

// Propuestas de la comunidad (se cargan desde Firestore)
let PROPOSALS = [];
const ZERO_SCORES = { flow:0, lirica:0, contenido:0, versatilidad:0, hooks:0, impacto:0 };

// Recalcula artistas nacionales (desde ARTISTS) y propuestas (desde PROPOSALS + votos)
function refreshEstados() {
  ESTADOS.forEach(e => {
    e.artists = ARTISTS.filter(a => a.estado === e.name)
      .map(a => ({ name: a.name, genre: a.tags[1] || '', score: a.total, national: true }));
    e.proposed = PROPOSALS.filter(p => p.estado === e.id).map(p => {
      const st = window._communityStats[p.slug];
      const n = st && st.count > 0 ? st.count : 0;
      const scores = {};
      CATEGORIES.forEach(c => { scores[c] = n ? Math.round((st.sum?.[c] || 0) / n) : 0; });
      return { ...p, votes: n, scores, total: n ? avgScores(scores) : 0 };
    });
  });
  if (_estadosRendered) {
    _estadosRendered = false;
    const sec = document.getElementById('section-estados');
    if (sec && sec.style.display !== 'none') {
      renderEstados();
      if (selectedEstado) selectEstado(selectedEstado);
    }
  }
}
window.refreshEstados = refreshEstados;
window.applyProposals = function(list) {
  PROPOSALS = list.map(p => ({ ...p, slug: 'prop-' + p.id }));
  refreshEstados();
};
setTimeout(refreshEstados, 0); // después de declarar _estadosRendered / selectedEstado

let selectedEstado = null;
let estView = 'map'; // 'map' | 'list'

// find lowest-scoring national artist to compare against
function getNationalFloor() {
  const sorted = [...ARTISTS].sort((a,b)=>a.total-b.total);
  return sorted[0]; // lowest in national ranking
}

function getUpgradeTarget(score) {
  // find the lowest national artist that this local artist beats
  const sorted = [...ARTISTS].sort((a,b)=>a.total-b.total);
  return sorted.find(a => score > a.total) || null;
}

// ── RENDER ESTADOS SECTION ──────────────────────────────────
let _estadosRendered = false;
function renderEstados() {
  if (_estadosRendered) return;
  _estadosRendered = true;
  const sec = document.getElementById('section-estados');

  const totalProposed = ESTADOS.reduce((s,e)=>s+e.proposed.length,0);
  const statesWithArtists = ESTADOS.filter(e=>e.artists.length>0||e.proposed.length>0).length;

  sec.innerHTML = `
    <!-- hero -->
    <div class="estados-hero">
      <div class="estados-hero-left">
        <div class="hero-label">Mapa de Rap</div>
        <h2>RAP POR<br><em>ESTADO</em></h2>
        <p class="estados-hero-desc">
          Cada estado tiene su escena. Los artistas consolidados ya están en el ranking nacional.
          Aquí, los fans locales proponen a los próximos: sube un link, la comunidad vota,
          y si supera en puntuación a alguien del ranking nacional — sube.
        </p>
        <div class="estados-stats">
          <div><span class="est-stat-num">${statesWithArtists}</span><span class="est-stat-lbl">Estados activos</span></div>
          <div><span class="est-stat-num">${totalProposed}</span><span class="est-stat-lbl">Propuestas activas</span></div>
          <div><span class="est-stat-num">${ARTISTS.length}</span><span class="est-stat-lbl">En ranking nacional</span></div>
        </div>
      </div>
      <div class="upgrade-rules">
        <div class="upgrade-rules-title">¿Cómo sube un artista local al nacional?</div>
        <div class="rule-item"><span class="rule-num">1</span><span>Cualquier usuario propone un artista de su estado con link de YouTube o Spotify.</span></div>
        <div class="rule-item"><span class="rule-num">2</span><span>La comunidad lo escucha y lo califica en las 6 categorías (1–100 cada una).</span></div>
        <div class="rule-item"><span class="rule-num">3</span><span>Si su puntuación promedio supera la del artista más bajo en el ranking nacional, puede ser promovido.</span></div>
        <div class="rule-item"><span class="rule-num">4</span><span>Se necesitan mínimo 50 calificaciones de cuentas con correo verificado para que el equipo revise su promoción.</span></div>
      </div>
    </div>

    <!-- tab bar -->
    <div class="est-tabs">
      <button class="est-tab active" id="tab-map" onclick="switchEstView('map',this)">Mapa interactivo</button>
      <button class="est-tab" id="tab-list" onclick="switchEstView('list',this)">Lista de estados</button>
    </div>

    <!-- body -->
    <div class="estados-body">
      <!-- LEFT: map or list -->
      <div>
        <!-- MAP VIEW -->
        <div class="map-view-wrap" id="mapViewWrap">
          <div class="map-container">
            <div class="map-title">Clic en un estado para ver su escena local</div>
            <div id="mexico-map">${buildMexicoSVG()}</div>
            <div class="map-legend">
              <span style="font-size:10px;color:var(--muted)"><span class="legend-dot" style="background:#1a1a2e;border-color:#333366"></span>Con artistas nacionales</span>
              <span style="font-size:10px;color:var(--muted)"><span class="legend-dot" style="background:#1a2a1a;border-color:#336633"></span>Con propuestas locales</span>
              <span style="font-size:10px;color:var(--muted)"><span class="legend-dot" style="background:var(--surface2);border-color:var(--border)"></span>Sin artistas aún</span>
            </div>
          </div>
        </div>
        <!-- LIST VIEW -->
        <div class="states-list-view" id="listViewWrap">
          <div class="states-grid" id="statesGrid"></div>
        </div>
      </div>

      <!-- RIGHT: state panel -->
      <div class="state-panel" id="statePanel">
        <div class="state-card">
          <div style="padding:32px;text-align:center">
            <div style="font-size:32px;opacity:0.15;margin-bottom:12px">◈</div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin-bottom:8px;opacity:0.4">Selecciona un estado</div>
            <div style="font-size:11px;color:var(--muted)">Clic en el mapa o en la lista para ver los artistas de ese estado.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- LOCAL ARTIST MODAL -->
    <div class="la-modal-overlay" id="laModal" onclick="closeLaModalOutside(event)">
      <div class="la-modal">
        <button class="la-modal-close" onclick="closeLaModal()">✕</button>
        <div id="laModalContent"></div>
      </div>
    </div>
  `;

  renderStatesList();
  applyMapClasses();
}

function switchEstView(view, btn) {
  estView = view;
  document.querySelectorAll('.est-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('mapViewWrap').classList.toggle('hidden', view==='list');
  document.getElementById('listViewWrap').classList.toggle('active', view==='list');
}

function renderStatesList() {
  const grid = document.getElementById('statesGrid');
  if (!grid) return;
  grid.innerHTML = ESTADOS.map(e => {
    const total = e.artists.length + e.proposed.length;
    const dotClass = e.artists.length>0 ? 'has' : e.proposed.length>0 ? 'proposed' : '';
    return `<div class="state-mini-card ${selectedEstado===e.id?'selected':''}" onclick="selectEstado('${e.id}')">
      <div class="smc-dot ${dotClass}"></div>
      <div class="smc-name">${e.name}</div>
      <div class="smc-count">${total === 0 ? 'Sin artistas aún' : total + ' artista' + (total>1?'s':'')}</div>
    </div>`;
  }).join('');
}

function applyMapClasses() {
  ESTADOS.forEach(e => {
    const el = document.querySelector(`[data-estado="${e.id}"]`);
    if (!el) return;
    el.classList.remove('has-artists','has-proposed','both','selected');
    if (e.artists.length > 0 && e.proposed.length > 0) el.classList.add('both');
    else if (e.artists.length > 0) el.classList.add('has-artists');
    else if (e.proposed.length > 0) el.classList.add('has-proposed');
    if (selectedEstado === e.id) el.classList.add('selected');
  });
}

function selectEstado(id) {
  selectedEstado = id;
  applyMapClasses();
  renderStatesList();
  const estado = ESTADOS.find(e=>e.id===id);
  renderStatePanel(estado);
  document.getElementById('statePanel').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderStatePanel(estado) {
  const panel = document.getElementById('statePanel');
  const upgradeTarget = getNationalFloor();

  let nationalsHtml = '';
  if (estado.artists.length > 0) {
    const sorted = [...estado.artists].sort((a,b)=>b.score-a.score);
    nationalsHtml = `
      <div class="state-card">
        <div class="state-card-header">
          <div>
            <div class="state-card-name">En el ranking nacional</div>
            <div class="state-card-count">${estado.artists.length} artista${estado.artists.length>1?'s':''} de ${estado.name}</div>
          </div>
          <div class="state-card-badge active-badge">Confirmados</div>
        </div>
        ${sorted.map((a,i) => `
          <div class="local-artist-row" onclick="openNationalArtist('${a.name.replace(/'/g, "\\'")}')">
            <div class="la-rank">${i+1}</div>
            <div class="la-avatar">${esc(a.name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase())}</div>
            <div class="la-info">
              <div class="la-name">${esc(a.name)}</div>
              <div class="la-sub">${a.genre}</div>
            </div>
            <div style="text-align:right">
              <div class="la-score">${a.score}</div>
              <div class="la-votes">Nacional ↗</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  let proposedHtml = '';
  if (estado.proposed.length > 0) {
    const sorted = [...estado.proposed].sort((a,b)=>b.total-a.total);
    proposedHtml = `
      <div class="state-card">
        <div class="state-card-header">
          <div>
            <div class="state-card-name">Propuestas locales</div>
            <div class="state-card-count">${estado.proposed.length} propuesta${estado.proposed.length>1?'s':''}</div>
          </div>
          <div class="state-card-badge" style="border-color:var(--green);color:var(--green)">Votando</div>
        </div>
        ${sorted.map((a,i) => {
          const canUpgrade = a.votes > 0 && a.total > upgradeTarget.total;
          return `
          <div class="local-artist-row" onclick="openLocalArtist('${estado.id}','${a.id}')">
            <div class="la-rank" style="color:${canUpgrade?'var(--accent2)':'var(--muted)'}">${i+1}</div>
            <div class="la-avatar" style="border-color:${canUpgrade?'rgba(255,204,0,0.4)':'var(--border)'}">${esc(a.name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase())}</div>
            <div class="la-info">
              <div class="la-name">${esc(a.name)}${canUpgrade?'<span class="upgrade-badge">Puede subir</span>':''}</div>
              <div class="la-sub">${esc(a.genre)}</div>
            </div>
            <div style="text-align:right;min-width:60px">
              <div class="la-score" style="color:${canUpgrade?'var(--accent2)':'var(--muted)'}">${a.votes ? a.total : '—'}</div>
              <div class="la-votes">${a.votes} voto${a.votes===1?'':'s'}</div>
            </div>
            <button class="la-upvote" title="Calificar" onclick="event.stopPropagation();openLocalArtist('${estado.id}','${a.id}')">★</button>
          </div>
        `}).join('')}
      </div>
    `;
  }

  let emptyProposedHtml = '';
  if (estado.proposed.length === 0) {
    emptyProposedHtml = `
      <div class="state-card">
        <div class="empty-state">
          <div class="empty-icon">◎</div>
          <div class="empty-title">Sé el primero</div>
          <div class="empty-sub">No hay propuestas para ${estado.name} todavía.<br>¿Conoces a alguien que debería estar aquí?</div>
        </div>
      </div>
    `;
  }

  panel.innerHTML = `
    <div class="state-card">
      <div class="state-card-header">
        <div>
          <div class="state-card-name" style="font-size:32px">${estado.name}</div>
          <div class="state-card-count">${estado.artists.length} nacional${estado.artists.length!==1?'es':''} · ${estado.proposed.length} propuesta${estado.proposed.length!==1?'s':''}</div>
        </div>
      </div>
    </div>
    ${nationalsHtml}
    ${proposedHtml || emptyProposedHtml}
    <!-- PROPOSE FORM -->
    <div class="state-card">
      <div class="propose-form">
        <div class="propose-title">Proponer artista de ${estado.name}</div>

          <input class="form-input" id="propName" placeholder="Ej: DJ Oaxaca, Flow Norteño...">
        </div>
        <div class="form-row">
          <label class="form-label">Género / estilo</label>
          <input class="form-input" id="propGenre" placeholder="Ej: Rap Consciente, Trap, Old School...">
        </div>
        <div class="form-row">
          <label class="form-label">Link de YouTube, Spotify o SoundCloud</label>
          <input class="form-input" id="propLink" placeholder="https://...">
        </div>
        <div class="form-row">
          <label class="form-label">Por qué merece estar aquí (opcional)</label>
          <input class="form-input" id="propBio" placeholder="Breve descripción...">
        </div>
        <button class="btn-propose" onclick="submitProposal('${estado.id}')">Proponer artista ↗</button>
      </div>
    </div>
  `;
}

async function submitProposal(estadoId) {
  const name = document.getElementById('propName').value.trim();
  const genre = document.getElementById('propGenre').value.trim();
  const link = document.getElementById('propLink').value.trim();
  const bio = document.getElementById('propBio').value.trim();
  if (!name) { showToast('Escribe el nombre del artista'); return; }
  if (name.length > 60) { showToast('El nombre es demasiado largo'); return; }
  if (!/^https:\/\/\S+$/i.test(link) || link.length > 300) { showToast('Agrega un link válido de YouTube, Spotify o SoundCloud (https://...)'); return; }
  if (ARTISTS.some(a => slugify(a.name) === slugify(name))) { showToast(name + ' ya está en el ranking nacional'); return; }
  if (PROPOSALS.some(p => p.estado === estadoId && slugify(p.name) === slugify(name))) { showToast('Ese artista ya fue propuesto'); return; }
  if (typeof window.saveProposal !== 'function') { showToast('Las propuestas no están disponibles en este momento'); return; }
  const data = {
    name, estado: estadoId,
    genre: (genre || 'Sin clasificar').slice(0, 60),
    link,
    bio: (bio || 'Artista propuesto por la comunidad.').slice(0, 280)
  };
  const id = await window.saveProposal(data);
  if (!id) return;
  PROPOSALS.push({ ...data, id, slug: 'prop-' + id });
  refreshEstados();
  const estado = ESTADOS.find(e => e.id === estadoId);
  if (estado) renderStatePanel(estado);
  showToast('¡' + name + ' propuesto! Ahora la comunidad puede calificarlo.');
}

function openLocalArtist(estadoId, propId) {
  const estado = ESTADOS.find(e=>e.id===estadoId);
  const artist = estado && estado.proposed.find(a=>a.id===propId);
  if (!artist) return;
  const artistName = esc(artist.name);
  const upgradeTarget = getUpgradeTarget(artist.total);
  const floor = getNationalFloor();

  let upgradeHtml = '';
  if (upgradeTarget && artist.votes > 0) {
    upgradeHtml = `
      <div class="upgrade-check">
        <div class="uc-title">¿Puede subir al ranking nacional?</div>
        <div class="uc-row"><span class="uc-label">Puntuación de ${artistName}</span><span class="uc-val win">${artist.total}</span></div>
        <div class="uc-row"><span class="uc-label">Artista más bajo en nacional (${upgradeTarget.name})</span><span class="uc-val lose">${upgradeTarget.total}</span></div>
        <div class="uc-verdict" style="color:var(--green)">
          ✓ <strong>${artistName}</strong> supera en puntuación a <strong>${upgradeTarget.name}</strong> (${upgradeTarget.total} pts).
          Con 50 votos válidos puede ser promovido al ranking nacional. Actualmente tiene ${artist.votes} votos.
          ${artist.votes < 50 ? `Faltan ${50 - artist.votes} votos para activar la revisión.` : 'Ya cumple el mínimo de votos. Pendiente de revisión del equipo.'}
        </div>
      </div>
    `;
  } else {
    upgradeHtml = `
      <div class="upgrade-check">
        <div class="uc-title">¿Puede subir al ranking nacional?</div>
        <div class="uc-row"><span class="uc-label">Puntuación actual</span><span class="uc-val lose">${artist.votes ? artist.total : '—'}</span></div>
        <div class="uc-row"><span class="uc-label">Mínimo para entrar al nacional</span><span class="uc-val">${floor.total + 1}+</span></div>
        <div class="uc-verdict" style="color:var(--muted)">
          Aún no supera en puntuación a ningún artista del ranking nacional. Necesita más votos y calificaciones para que su score suba.
        </div>
      </div>
    `;
  }

  document.getElementById('laModalContent').innerHTML = `
    <div class="la-modal-name">${esc(artist.name)}</div>
    <div class="la-modal-state">${estado.name} · ${esc(artist.genre)} · ${artist.votes} voto${artist.votes===1?'':'s'}</div>
    <div class="la-modal-link">
      <span style="opacity:0.4">↗</span>
      ${/^https:\/\//i.test(artist.link) ? `<a href="${esc(artist.link)}" target="_blank" rel="noopener noreferrer nofollow">${esc(artist.link)}</a>` : ''}
    </div>
    <p style="font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:16px">${esc(artist.bio)}</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
      ${Object.entries(artist.scores).map(([k,v])=>`
        <div>
          <div style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px">${CAT_LABELS[k]||k}</div>
          <div style="height:3px;background:var(--border);position:relative;overflow:hidden;margin-bottom:3px"><div style="height:100%;position:absolute;left:0;width:${v}%;background:var(--accent)"></div></div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:16px">${v}</div>
        </div>
      `).join('')}
    </div>
    ${upgradeHtml}
    ${buildRateBox(artist.slug, artist.name, { flow:50, lirica:50, contenido:50, versatilidad:50, hooks:50, impacto:50 })}
  `;
  document.getElementById('laModal').classList.add('open');
}

function openNationalArtist(name) {
  // scroll to and open in main ranking
  showSection('rankings', document.getElementById('nav-rankings'));
  setTimeout(()=>{
    const el = document.querySelector(`[data-name="${name}"]`);
    if (el) {
      el.scrollIntoView({behavior:'smooth',block:'center'});
      el.style.background='var(--surface2)';
      setTimeout(()=>el.style.background='',1500);
    }
  }, 300);
}

function closeLaModal() { document.getElementById('laModal').classList.remove('open'); }
function closeLaModalOutside(e) { if(e.target===document.getElementById('laModal')) closeLaModal(); }


// Map tooltip
document.addEventListener('mousemove', function(e) {
  const path = e.target.closest('[data-estado]');
  const tt = document.getElementById('map-tooltip');
  if (!tt) return;
  if (path) {
    const sid = path.getAttribute('data-estado');
    const estado = ESTADOS.find(s=>s.id===sid);
    if (!estado) return;
    const mapEl = document.getElementById('mexico-map');
    if (!mapEl) return;
    const rect = mapEl.getBoundingClientRect();
    const info = estado.artists.length > 0 ? ` · ${estado.artists.length} nac.` : estado.proposed.length > 0 ? ` · ${estado.proposed.length} prop.` : ' · sin artistas';
    tt.textContent = estado.name + info;
    tt.style.display = 'block';
    tt.style.left = (e.clientX - rect.left + 10) + 'px';
    tt.style.top  = (e.clientY - rect.top  - 30) + 'px';
  } else {
    tt.style.display = 'none';
  }
});

// ── SECTION SWITCHER ─────────────────────────────────────────
// ── MOBILE NAV ──────────────────────────────────────────────
function toggleNav() {
  const nav = document.getElementById('mainNav');
  const btn = document.getElementById('hamburgerBtn');
  nav.classList.toggle('open');
  // animate hamburger to X
  const spans = btn.querySelectorAll('span');
  if (nav.classList.contains('open')) {
    spans[0].style.cssText = 'transform:rotate(45deg) translate(5px,5px)';
    spans[1].style.cssText = 'opacity:0';
    spans[2].style.cssText = 'transform:rotate(-45deg) translate(5px,-5px)';
  } else {
    spans.forEach(s => s.style.cssText = '');
  }
}
function closeNav() {
  const nav = document.getElementById('mainNav');
  const btn = document.getElementById('hamburgerBtn');
  nav.classList.remove('open');
  if (btn) btn.querySelectorAll('span').forEach(s => s.style.cssText = '');
}
// Close nav on outside click
document.addEventListener('click', function(e) {
  const nav = document.getElementById('mainNav');
  const btn = document.getElementById('hamburgerBtn');
  if (nav && btn && !nav.contains(e.target) && !btn.contains(e.target)) {
    nav.classList.remove('open');
    btn.querySelectorAll('span').forEach(s => s.style.cssText = '');
  }
});

// ─── RUTAS (#estados, #emergentes, #comparar, #editorial) ──
function goTo(target) {
  const navR = document.getElementById('nav-rankings');
  if (target === 'estados') { showSection('estados', document.getElementById('nav-estados')); history.replaceState(null,'','#estados'); return; }
  showSection('rankings', navR);
  if (target === 'emergentes') {
    filterTier('emerging');
    navR.classList.remove('active'); document.getElementById('nav-emergentes').classList.add('active');
    history.replaceState(null,'','#emergentes');
  } else if (target === 'comparar') {
    navR.classList.remove('active'); document.getElementById('nav-comparar').classList.add('active');
    history.replaceState(null,'','#comparar');
    if (compareList.length === 2) openCompareModal();
    else showToast('Abre un artista con ▾ y toca "+ Comparar" (elige 2)');
  } else if (target === 'editorial') {
    showToast('La sección editorial llega pronto');
  } else {
    filterTier('all');
    history.replaceState(null,'',location.pathname);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.addEventListener('load', () => {
  const h = location.hash.replace('#','');
  if (['estados','emergentes','comparar','editorial'].includes(h)) goTo(h);
});

function showSection(id, btn) {
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('section-rankings').style.display = id==='rankings' ? '' : 'none';
  const estSec = document.getElementById('section-estados');
  if (id === 'estados') {
    estSec.style.display = '';
    // defer so ESTADOS script block is guaranteed loaded
    setTimeout(function() {
      if (!_estadosRendered) {
        if (typeof renderEstados === 'function') renderEstados();
        else console.error('renderEstados not found');
      }
    }, 0);
  } else {
    estSec.style.display = 'none';
  }
  document.querySelector('.controls').style.display = id==='rankings' ? '' : 'none';
}

const app       = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth      = getAuth(app);
const db        = getFirestore(app);

let currentUser = null;
let authMode    = "login";

// slugify() y esc() vienen del script principal
const CATS = ['flow','lirica','contenido','versatilidad','hooks','impacto'];

// ── UPDATE ALL AUTH BUTTONS ──────────────────────────────────
function syncAuthUI(user) {
  // Desktop buttons
  const dLogin    = document.getElementById("desktopLoginBtn");
  const dRegister = document.getElementById("desktopRegisterBtn");
  // Mobile button
  const mBtn      = document.getElementById("mobileAuthBtn");

  if (user) {
    const name = user.email ? user.email.split("@")[0] : "Mi cuenta";
    if (dLogin)    { dLogin.textContent    = "Cerrar sesión"; dLogin.onclick = () => signOut(auth); }
    if (dRegister) { dRegister.textContent = name; dRegister.onclick = null; dRegister.style.opacity = ".7"; }
    if (mBtn)      { mBtn.textContent = name; mBtn.classList.add("logged-in"); mBtn.onclick = () => signOut(auth); }
  } else {
    if (dLogin)    { dLogin.textContent    = "Iniciar sesión"; dLogin.onclick = () => openAuthModal("login"); }
    if (dRegister) { dRegister.textContent = "Registrarse"; dRegister.onclick = () => openAuthModal("register"); dRegister.style.opacity = ""; }
    if (mBtn)      { mBtn.textContent = "Entrar"; mBtn.classList.remove("logged-in"); mBtn.onclick = () => openAuthModal("login"); }
  }
}

// ── AUTH MODAL ────────────────────────────────────────────────
function setAuthMode(mode) {
  authMode = mode;
  const title      = document.getElementById("authTitle");
  const submitBtn  = document.getElementById("authSubmitBtn");
  const switchText = document.getElementById("authSwitchText");
  if (!title) return;
  if (mode === "register") {
    title.textContent     = "Crear cuenta";
    submitBtn.textContent = "Registrarse";
    switchText.innerHTML  = `¿Ya tienes cuenta? <button type="button" onclick="setAuthMode('login')">Iniciar sesión</button>`;
  } else {
    title.textContent     = "Iniciar sesión";
    submitBtn.textContent = "Entrar";
    switchText.innerHTML  = `¿No tienes cuenta? <button type="button" onclick="setAuthMode('register')">Crear cuenta</button>`;
  }
}

function openAuthModal(mode = "login") {
  setAuthMode(mode);
  document.getElementById("authModal").classList.add("open");
}
function closeAuthModal() {
  document.getElementById("authModal").classList.remove("open");
}
function closeAuthModalOutside(e) {
  if (e.target.id === "authModal") closeAuthModal();
}

window.setAuthMode           = setAuthMode;
window.openAuthModal         = openAuthModal;
window.closeAuthModal        = closeAuthModal;
window.closeAuthModalOutside = closeAuthModalOutside;

// ── AUTH SUBMIT ───────────────────────────────────────────────
document.getElementById("authSubmitBtn").addEventListener("click", async () => {
  const email    = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value.trim();
  if (!email || !password) { showToast("Ingresa correo y contraseña"); return; }
  if (password.length < 6) { showToast("La contraseña debe tener mínimo 6 caracteres"); return; }
  try {
    if (authMode === "register") {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "users", cred.user.uid), {
        email, role: "user", createdAt: serverTimestamp()
      });
      try { await sendEmailVerification(cred.user); } catch (e) { console.warn(e); }
      showToast("Cuenta creada ✓ Revisa tu correo para confirmarla y poder votar");
    } else {
      await signInWithEmailAndPassword(auth, email, password);
      showToast("Sesión iniciada ✓");
    }
    closeAuthModal();
  } catch (err) {
    const msgs = {
      "auth/email-already-in-use": "Ese correo ya está registrado",
      "auth/invalid-credential":   "Correo o contraseña incorrectos",
      "auth/user-not-found":       "Correo o contraseña incorrectos",
      "auth/wrong-password":       "Correo o contraseña incorrectos",
      "auth/too-many-requests":    "Demasiados intentos. Espera un momento.",
    };
    showToast(msgs[err.code] || "Error: " + err.message);
  }
});

// ── AUTH STATE ────────────────────────────────────────────────
let myRatings = {};
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  syncAuthUI(user);
  myRatings = {};
  if (user) {
    try {
      const snap = await getDocs(query(collection(db, "ratings"), where("uid", "==", user.uid)));
      snap.forEach(d => { const r = d.data(); myRatings[r.artistSlug] = r.scores; });
    } catch (err) { console.warn("RapScore ratings:", err.code || err.message); }
  }
  refreshOpenRateBoxes();
});

// Vuelve a dibujar el formulario abierto (para mostrar "Tu calificación")
function refreshOpenRateBoxes() {
  document.querySelectorAll(".rate-box").forEach(box => {
    const slug = box.dataset.slug, name = box.dataset.name;
    const mine = myRatings[slug];
    if (!mine) return;
    box.querySelectorAll('input[type="range"]').forEach(inp => {
      inp.value = mine[inp.dataset.cat]; inp.nextElementSibling.textContent = inp.value;
    });
    const t = box.querySelector(".rate-title"); if (t) t.textContent = "Tu calificación";
    const btn = box.querySelector(".rate-submit"); if (btn) btn.textContent = "Actualizar calificación";
  });
}
window.getMyRating = (slug) => myRatings[slug] || null;

// ── PROMEDIOS DE LA COMUNIDAD ─────────────────────────────────
async function loadCommunity() {
  try {
    const [statsSnap, propSnap] = await Promise.all([
      getDocs(collection(db, "artistStats")),
      getDocs(collection(db, "proposals"))
    ]);
    const stats = {};
    statsSnap.forEach(d => { stats[d.id] = d.data(); });
    window._communityStats = stats;
    const props = [];
    propSnap.forEach(d => { const p = d.data(); props.push({ id: d.id, name: p.name, estado: p.estado, genre: p.genre, link: p.link, bio: p.bio }); });
    if (window.applyProposals) window.applyProposals(props);
    if (window.applyCommunityStats) window.applyCommunityStats(stats);
  } catch (err) {
    console.warn("RapScore comunidad:", err.code || err.message);
  }
}
loadCommunity();

// ── CUENTA VERIFICADA ─────────────────────────────────────────
async function ensureVerified() {
  if (!currentUser) {
    showToast("Inicia sesión para votar");
    openAuthModal("login");
    return false;
  }
  if (currentUser.emailVerified) return true;
  try { await reload(currentUser); } catch (e) {}
  if (auth.currentUser && auth.currentUser.emailVerified) {
    await getIdToken(auth.currentUser, true); // refresca el token para las reglas
    return true;
  }
  try { await sendEmailVerification(auth.currentUser); } catch (e) {}
  showToast("Confirma tu correo para votar. Te enviamos el enlace (revisa spam).");
  return false;
}

// ── GUARDAR CALIFICACIÓN ──────────────────────────────────────
// Escribe ratings/{uid}_{slug} y actualiza artistStats/{slug} (suma y conteo) en una sola transacción.
window.submitRating = async function(btn) {
  const box = btn.closest(".rate-box");
  const slug = box?.dataset.slug, name = box?.dataset.name;
  if (!slug) return;
  if (!(await ensureVerified())) return;
  const scores = {};
  CATS.forEach(c => {
    const v = parseInt(box.querySelector(`input[data-cat="${c}"]`).value, 10);
    scores[c] = Math.min(100, Math.max(1, isNaN(v) ? 50 : v));
  });
  const uid = auth.currentUser.uid;
  const rRef = doc(db, "ratings", `${uid}_${slug}`);
  const sRef = doc(db, "artistStats", slug);
  btn.disabled = true;
  try {
    const newStats = await runTransaction(db, async (tx) => {
      const rSnap = await tx.get(rRef);
      const sSnap = await tx.get(sRef);
      const old = rSnap.exists() ? rSnap.data().scores : null;
      const st = sSnap.exists() ? sSnap.data() : { count: 0, sum: {} };
      const sum = {};
      CATS.forEach(c => { sum[c] = (st.sum?.[c] || 0) + scores[c] - (old ? old[c] : 0); });
      const count = (st.count || 0) + (old ? 0 : 1);
      tx.set(rRef, { uid, artistSlug: slug, artist: name, scores, updatedAt: serverTimestamp() });
      tx.set(sRef, { count, sum, updatedAt: serverTimestamp() });
      return { count, sum };
    });
    myRatings[slug] = scores;
    window._communityStats[slug] = newStats;
    if (window.applyCommunityStats) window.applyCommunityStats();
    if (slug.startsWith("prop-") && window.refreshEstados) window.refreshEstados();
    showToast("Calificación guardada ✓");
  } catch (err) {
    console.error(err);
    showToast(err.code === "permission-denied"
      ? "No se pudo guardar (permisos). Confirma tu correo o intenta más tarde."
      : "Error al guardar la calificación");
  } finally {
    btn.disabled = false;
  }
};

// ── GUARDAR PROPUESTA ─────────────────────────────────────────
window.saveProposal = async function(data) {
  if (!(await ensureVerified())) return null;
  try {
    const ref = await addDoc(collection(db, "proposals"), {
      ...data, createdBy: auth.currentUser.uid, createdAt: serverTimestamp()
    });
    return ref.id;
  } catch (err) {
    console.error(err);
    showToast(err.code === "permission-denied" ? "No se pudo guardar la propuesta (permisos)" : "Error al guardar la propuesta");
    return null;
  }
};
