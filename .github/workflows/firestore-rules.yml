# Publica firestore.rules en Firebase automáticamente cada vez que cambian en main.
# También se puede correr a mano: GitHub → Actions → "Publicar reglas de Firebase" → Run workflow.
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (la llave JSON de una cuenta de servicio del proyecto rapscoremx).
name: Publicar reglas de Firebase

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'firebase.json']
  workflow_dispatch:

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que exista la llave
        id: cred
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT. Las reglas NO se publicaron; publícalas a mano en la consola de Firebase o agrega el secreto."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.cred.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Publicar reglas
        if: steps.cred.outputs.ok == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project rapscoremx --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
